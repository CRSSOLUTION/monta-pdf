# SonarQube Cloud - CI-based analysis (runs in .github/workflows/ci.yml after the tests)
# Automatic Analysis must be OFF in SonarQube Cloud:
# Project > Administration > Analysis Method > Automatic Analysis: off
sonar.organization=crssolution
sonar.projectKey=CRSSOLUTION_monta-pdf
sonar.projectName=Monta PDF

sonar.sources=MontaPDF/MontaPDF,server
sonar.tests=MontaPDF/MontaPDFTests,MontaPDF/MontaPDFUITests
sonar.exclusions=**/*.xcassets/**,**/*.xcstrings
sonar.coverageReportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
