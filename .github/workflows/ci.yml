name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube needs the full history to detect new code

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Find simulator
        id: simulator
        run: echo "udid=$(ci/find-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        working-directory: MontaPDF
        run: |
          set -o pipefail
          xcodebuild test \
            -project MontaPDF.xcodeproj \
            -scheme MontaPDF \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:MontaPDFTests \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -enableCodeCoverage YES \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Convert coverage for SonarQube
        run: ci/xccov-to-sonar.py "$RUNNER_TEMP/TestResults.xcresult" "$GITHUB_WORKSPACE" > coverage.xml

      - name: SonarQube Cloud analysis
        # Skipped on pull requests from forks, which can't read the token.
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Boot simulator for UI tests
        run: |
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Build UI tests
        working-directory: MontaPDF
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project MontaPDF.xcodeproj \
            -scheme MontaPDF \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Warm up the app on the simulator
        # The first launch on a freshly booted simulator is slow (the app is registered
        # with the system) and XCUITest gave up ("Timed out while launching application").
        # Install and open the app once so the tests start from a warm simulator.
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/MontaPDF.app"
          UDID="${{ steps.simulator.outputs.udid }}"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.crlsribeiro.MontaPDF -ui-testing
          sleep 20
          xcrun simctl terminate "$UDID" com.crlsribeiro.MontaPDF || true

      - name: Run UI tests
        working-directory: MontaPDF
        # One simulator, tests in series: parallel clones on the shared runner
        # fail to launch the app ("Failed to send signal 19").
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project MontaPDF.xcodeproj \
            -scheme MontaPDF \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:MontaPDFUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/UITestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-ui.log" | grep -E "Test (Case|case|Suite)|error:|XCTAssert|failed|passed|\*\*"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/UITestResults.xcresult
            ${{ runner.temp }}/xcodebuild-ui.log
